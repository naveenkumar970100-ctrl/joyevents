events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Upstream: 3 backend containers (round-robin load balancing) ───────────
    upstream backend_pool {
        least_conn;                    # route to least-busy backend
        server backend1:5001;
        server backend2:5001;
        server backend3:5001;
    }

    # ── Upstream: frontend container ─────────────────────────────────────────
    upstream frontend_app {
        server frontend:80;
    }

    # ── Logging ───────────────────────────────────────────────────────────────
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    # ── Main server ───────────────────────────────────────────────────────────
    server {
        listen 80;
        server_name _;

        client_max_body_size 50M;

        # ── API requests → load-balanced backend pool ─────────────────────────
        location /api/ {
            proxy_pass         http://backend_pool;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";

            # Timeouts
            proxy_connect_timeout 30s;
            proxy_send_timeout    60s;
            proxy_read_timeout    60s;

            # Retry on failure — try next backend if one is down
            proxy_next_upstream error timeout http_502 http_503 http_504;
        }

        # ── Health check endpoint ─────────────────────────────────────────────
        location /health {
            proxy_pass         http://backend_pool;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
        }

        # ── Uploaded files → any backend (they share the same volume) ─────────
        location /uploads/ {
            proxy_pass         http://backend_pool;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
        }

        # ── Everything else → frontend ────────────────────────────────────────
        location / {
            proxy_pass         http://frontend_app;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }
    }
}
