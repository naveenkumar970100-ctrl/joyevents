version: "3.9"

# ── Shared backend environment ────────────────────────────────────────────────
x-backend-env: &backend-env
  NODE_ENV: production
  PORT: 5001
  MONGO_URI: ${MONGO_URI}
  MONGO_DB_NAME: ${MONGO_DB_NAME:-festiveflow}
  JWT_SECRET: ${JWT_SECRET}
  ADMIN_EMAIL: ${ADMIN_EMAIL}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD}
  ADMIN_NAME: ${ADMIN_NAME:-Admin}
  FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
  ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
  SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASS: ${SMTP_PASS:-}
  MAIL_FROM: ${MAIL_FROM:-}
  CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
  CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
  CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}

services:

  # ── Backend instance 1 ───────────────────────────────────────────────────────
  backend1:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    environment:
      <<: *backend-env
    volumes:
      - uploads_data:/app/uploads
    networks:
      - internal
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ── Backend instance 2 ───────────────────────────────────────────────────────
  backend2:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    environment:
      <<: *backend-env
    volumes:
      - uploads_data:/app/uploads
    networks:
      - internal
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ── Backend instance 3 ───────────────────────────────────────────────────────
  backend3:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    environment:
      <<: *backend-env
    volumes:
      - uploads_data:/app/uploads
    networks:
      - internal
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ── Frontend (React SPA served by Nginx) ─────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        # Empty = use relative /api paths, Nginx proxy handles routing
        VITE_API_URL: ""
    restart: unless-stopped
    networks:
      - internal
    depends_on:
      - backend1
      - backend2
      - backend3

  # ── Nginx reverse proxy + load balancer ──────────────────────────────────────
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - internal
    depends_on:
      - frontend
      - backend1
      - backend2
      - backend3

volumes:
  uploads_data:
    driver: local

networks:
  internal:
    driver: bridge
